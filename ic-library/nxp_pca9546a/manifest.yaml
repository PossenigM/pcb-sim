id: nxp/pca9546a
version: "0.1"
kind: logic
description: >
  NXP PCA9546A 4-channel I2C multiplexer.  A single-byte write selects which
  downstream channel(s) are enabled (bit N → channel N).  The simulator
  treats the mux as transparent: it records the channel-select byte and
  acknowledges all writes.  Downstream devices behind the mux must be
  assigned unique addresses on the same I2C bus.

interfaces:
  - name: i2c
    protocol: i2c
    role: slave
    pins: [SCL, SDA]
    config:
      address:
        type: hex
        default: 0x70
        choices: [0x70, 0x71, 0x72, 0x73, 0x74, 0x75, 0x76, 0x77]

pins:
  - { name: SCL, dir: in,    default: Z }
  - { name: SDA, dir: bidir, default: Z }

behavior: builtin:pca9546a
