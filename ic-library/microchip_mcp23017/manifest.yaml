id: microchip/mcp23017
version: "0.1"
kind: io_expander
description: 16-bit I2C GPIO expander. Two banks (A and B) of 8 pins each,
  individually configurable as input or output via I2C-accessed registers.

interfaces:
  - name: i2c
    protocol: i2c
    role: slave
    pins: [SCL, SDA]
    config:
      address:
        type: hex
        default: 0x20
        range: [0x20, 0x27]

  - name: gpio_a
    protocol: gpio
    pins: [GPA0, GPA1, GPA2, GPA3, GPA4, GPA5, GPA6, GPA7]

  - name: gpio_b
    protocol: gpio
    pins: [GPB0, GPB1, GPB2, GPB3, GPB4, GPB5, GPB6, GPB7]

  - name: irq
    protocol: gpio
    pins: [INTA, INTB]

pins:
  - { name: SCL,  dir: in,    default: Z }
  - { name: SDA,  dir: bidir, default: Z }
  - { name: GPA0, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPA1, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPA2, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPA3, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPA4, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPA5, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPA6, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPA7, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB0, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB1, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB2, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB3, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB4, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB5, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB6, dir: bidir, default: Z, runtime_configurable: true }
  - { name: GPB7, dir: bidir, default: Z, runtime_configurable: true }
  - { name: INTA, dir: out,   default: HIGH }
  - { name: INTB, dir: out,   default: HIGH }

behavior: builtin:mcp23017
