board:
  name: me7492p_digital_twin
  version: "0.1"

mqtt:
  broker: tcp://localhost:1883
  prefix: phem/me7492p/

components:
  # ── Firmware host (MicroBlaze) ──────────────────────────────────────────────
  - id: mcu
    type: xilinx/microblaze_me7492p@0.1
    firmware:
      transport: unix_socket
      path: /tmp/pcb_sim/mcu.sock

  # ── I2C bus 0: IO-Link PHY transceiver (×4) ────────────────────────────────
  - id: l6360_0
    type: st/l6360@0.1
    config:
      i2c.address: 0x60

  - id: l6360_1
    type: st/l6360@0.1
    config:
      i2c.address: 0x61

  - id: l6360_2
    type: st/l6360@0.1
    config:
      i2c.address: 0x62

  - id: l6360_3
    type: st/l6360@0.1
    config:
      i2c.address: 0x63

  # ── I2C bus 1 (peripheral): mux + sensors ──────────────────────────────────
  - id: i2c_mux
    type: nxp/pca9546a@0.1
    config:
      i2c.address: 0x70

  # Four SQ619 pressure sensors, each behind one channel of the PCA9546A mux.
  - id: pressure_sensor_0
    type: servoflo/sq619@0.1
    config:
      i2c.address: 0x78
    initial_values:
      pressure: 10130.0
    mqtt:
      subscribe:
        pressure: sensors/pressure/0

  - id: pressure_sensor_1
    type: servoflo/sq619@0.1
    config:
      i2c.address: 0x78
    initial_values:
      pressure: 10130.0
    mqtt:
      subscribe:
        pressure: sensors/pressure/1

  - id: pressure_sensor_2
    type: servoflo/sq619@0.1
    config:
      i2c.address: 0x78
    initial_values:
      pressure: 10130.0
    mqtt:
      subscribe:
        pressure: sensors/pressure/2

  - id: pressure_sensor_3
    type: servoflo/sq619@0.1
    config:
      i2c.address: 0x78
    initial_values:
      pressure: 10130.0
    mqtt:
      subscribe:
        pressure: sensors/pressure/3

  - id: io_expander
    type: nxp/pca9539a@0.1
    config:
      i2c.address: 0x76
      # Fixed revision pins (P0_0..P0_3 = board HW revision 0b0001)
      fixed_inputs:
        P0_0: HIGH
        P0_1: LOW
        P0_2: LOW
        P0_3: LOW

  - id: sfp_module
    type: broadcom/afbr710smz@0.1
    config:
      i2c.addresses: [0x50, 0x51]

  - id: pcb_temp
    type: ti/lm73@0.1
    config:
      i2c.address: 0x48
    initial_values:
      temperature: 25.0
    mqtt:
      subscribe:
        temperature: sensors/pcb_temperature

  # ── SPI bus: ADC + output driver ────────────────────────────────────────────
  - id: adc
    type: ti/ads7961@0.1
    initial_values:
      ch0: 0.0
      ch1: 0.0
      ch2: 0.0
      ch3: 0.0
      ch4: 0.0
      ch5: 0.0
      ch6: 0.0
      ch7: 0.0
      ch8: 0.0
    mqtt:
      subscribe:
        ch0: sensors/adc/ch0
        ch1: sensors/adc/ch1
        ch2: sensors/adc/ch2
        ch3: sensors/adc/ch3
        ch4: sensors/adc/ch4
        ch5: sensors/adc/ch5
        ch6: sensors/adc/ch6
        ch7: sensors/adc/ch7
        ch8: sensors/adc/ch8

  - id: output_driver
    type: nxp/mc33879@0.1
    config:
      signal_names:
        S1: Meniscus1-Valve
        S2: Purge-Valve
        S4: Block1-Valve
        S5: Block2-Valve
        S6: Meniscus2-Valve
    mqtt:
      publish:
        S1: actuators/valves/meniscus1
        S2: actuators/valves/purge
        S4: actuators/valves/block1
        S5: actuators/valves/block2
        S6: actuators/valves/meniscus2

  # ── UART: debug terminal ─────────────────────────────────────────────────────
  - id: term_stdout
    type: generic/uart_terminal@0.1

  # ── IO-Link level sensors (KQ5100) via L6360 PHY ────────────────────────────
  - id: kq5100_0
    type: ifm/kq5100@0.1
    mqtt:
      subscribe:
        level: sensors/iol/level0

  - id: kq5100_1
    type: ifm/kq5100@0.1
    mqtt:
      subscribe:
        level: sensors/iol/level1

  - id: kq5100_2
    type: ifm/kq5100@0.1
    mqtt:
      subscribe:
        level: sensors/iol/level2

  - id: kq5100_3
    type: ifm/kq5100@0.1
    mqtt:
      subscribe:
        level: sensors/iol/level3

  # ── Kyocera KJ4B printheads ─────────────────────────────────────────────────
  - id: printhead_0
    type: kyocera/kj4b@0.1
    mqtt:
      subscribe:
        temperature: ph/0/temperature
      publish:
        heater_target: ph/0/heater

  - id: printhead_1
    type: kyocera/kj4b@0.1
    mqtt:
      subscribe:
        temperature: ph/1/temperature
      publish:
        heater_target: ph/1/heater

  # ── Pumps (driven by FPGA PWM + IO expander enable) ──────────────────────────
  - id: pump_0
    type: generic/pump@0.1
    mqtt:
      publish:
        state: actuators/pump/0

  - id: pump_1
    type: generic/pump@0.1
    mqtt:
      publish:
        state: actuators/pump/1

  - id: pump_2
    type: generic/pump@0.1
    mqtt:
      publish:
        state: actuators/pump/2

  - id: pump_3
    type: generic/pump@0.1
    mqtt:
      publish:
        state: actuators/pump/3

buses:
  # ── I2C bus 0: main bus (L6360 IO-Link PHYs) ───────────────────────────────
  - id: i2c_main
    protocol: i2c
    members:
      - { component: mcu,    interface: i2c0 }
      - { component: l6360_0, interface: i2c }
      - { component: l6360_1, interface: i2c }
      - { component: l6360_2, interface: i2c }
      - { component: l6360_3, interface: i2c }

  # ── I2C bus 1: peripheral bus (mux + IO expander + SFP + temp) ────────────────
  - id: i2c_periph
    protocol: i2c
    members:
      - { component: mcu,              interface: i2c1 }
      - { component: i2c_mux,          interface: i2c }
      - { component: io_expander,      interface: i2c }
      - { component: sfp_module,       interface: i2c }
      - { component: pcb_temp,         interface: i2c }

  # ── I2C mux downstream channels (one SQ619 per channel) ────────────────────
  - id: i2c_mux_ch0
    protocol: i2c
    members:
      - { component: i2c_mux,          interface: i2c_ch0 }
      - { component: pressure_sensor_0, interface: i2c }

  - id: i2c_mux_ch1
    protocol: i2c
    members:
      - { component: i2c_mux,          interface: i2c_ch1 }
      - { component: pressure_sensor_1, interface: i2c }

  - id: i2c_mux_ch2
    protocol: i2c
    members:
      - { component: i2c_mux,          interface: i2c_ch2 }
      - { component: pressure_sensor_2, interface: i2c }

  - id: i2c_mux_ch3
    protocol: i2c
    members:
      - { component: i2c_mux,          interface: i2c_ch3 }
      - { component: pressure_sensor_3, interface: i2c }

  # ── SPI bus ─────────────────────────────────────────────────────────────────
  # cs_pin_on_master must match the exact pin name in the MicroBlaze manifest.
  - id: spi_main
    protocol: spi
    master:
      component: mcu
      interface: spi0
    slaves:
      - component: adc
        interface: spi
        cs_pin_on_master: SPI0_CS0
      - component: output_driver
        interface: spi
        cs_pin_on_master: SPI0_CS1

  # ── UART buses ───────────────────────────────────────────────────────────────
  - id: uart_stdout_bus
    protocol: uart
    peers:
      - { component: mcu,         interface: uart_stdout }
      - { component: term_stdout, interface: uart }

  - id: uart_iol0_bus
    protocol: uart
    peers:
      - { component: mcu,       interface: uart_iol0 }
      - { component: kq5100_0,  interface: uart }

  - id: uart_iol1_bus
    protocol: uart
    peers:
      - { component: mcu,       interface: uart_iol1 }
      - { component: kq5100_1,  interface: uart }

  - id: uart_iol2_bus
    protocol: uart
    peers:
      - { component: mcu,       interface: uart_iol2 }
      - { component: kq5100_2,  interface: uart }

  - id: uart_iol3_bus
    protocol: uart
    peers:
      - { component: mcu,       interface: uart_iol3 }
      - { component: kq5100_3,  interface: uart }

  - id: uart_ph0_bus
    protocol: uart
    peers:
      - { component: mcu,         interface: uart_ph0 }
      - { component: printhead_0, interface: uart }

  - id: uart_ph1_bus
    protocol: uart
    peers:
      - { component: mcu,         interface: uart_ph1 }
      - { component: printhead_1, interface: uart }

nets:
  # PWM pump outputs from FPGA to pump actuators
  - id: net_pwm_pump0
    endpoints:
      - { component: mcu, pin: PWM_PUMP0 }
      - { component: pump_0, pin: PWM }
  - id: net_pwm_pump1
    endpoints:
      - { component: mcu, pin: PWM_PUMP1 }
      - { component: pump_1, pin: PWM }
  - id: net_pwm_pump2
    endpoints:
      - { component: mcu, pin: PWM_PUMP2 }
      - { component: pump_2, pin: PWM }
  - id: net_pwm_pump3
    endpoints:
      - { component: mcu, pin: PWM_PUMP3 }
      - { component: pump_3, pin: PWM }
  # Pump enable signals from IO expander (P0_4..P0_7)
  - id: net_pump_en0
    endpoints:
      - { component: io_expander, pin: P0_4 }
      - { component: pump_0, pin: ENABLE }
  - id: net_pump_en1
    endpoints:
      - { component: io_expander, pin: P0_5 }
      - { component: pump_1, pin: ENABLE }
  - id: net_pump_en2
    endpoints:
      - { component: io_expander, pin: P0_6 }
      - { component: pump_2, pin: ENABLE }
  - id: net_pump_en3
    endpoints:
      - { component: io_expander, pin: P0_7 }
      - { component: pump_3, pin: ENABLE }
  # SFP signals connected to IO expander (P1_0..P1_3)
  - id: net_sfp_mod
    endpoints:
      - { component: sfp_module, pin: SFP_MOD }
      - { component: io_expander, pin: P1_0 }
  - id: net_rx_loss
    endpoints:
      - { component: sfp_module, pin: RX_LOSS }
      - { component: io_expander, pin: P1_1 }
  - id: net_tx_fault
    endpoints:
      - { component: sfp_module, pin: TX_FAULT }
      - { component: io_expander, pin: P1_2 }
  - id: net_tx_disable
    endpoints:
      - { component: io_expander, pin: P1_3 }
      - { component: sfp_module, pin: TX_DISABLE }
