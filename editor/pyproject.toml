[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pcb-sim-editor"
version = "0.1.0"
description = "Web-based authoring tool for pcb-sim board YAML files."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]
